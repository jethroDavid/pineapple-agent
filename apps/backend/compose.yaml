services:
  postgres:
    image: postgres:16
    container_name: pineapple-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pineapple
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pineapple-postgres-data:/var/lib/postgresql/data

volumes:
  pineapple-postgres-data:
